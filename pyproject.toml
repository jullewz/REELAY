[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reelay-http"
dynamic = ["version"]
description = "Record real HTTP API traffic, replay it as a mock server: chaos testing, live dashboard, API diffing and OpenAPI inference."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jullewz" }]
maintainers = [{ name = "jullewz" }]
keywords = ["http", "mock", "proxy", "record", "replay", "vcr", "api-testing", "openapi", "chaos-engineering", "har"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pyyaml>=6", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/jullewz/reelay"
Documentation = "https://github.com/jullewz/reelay/tree/main/docs"
Issues = "https://github.com/jullewz/reelay/issues"
Changelog = "https://github.com/jullewz/reelay/blob/main/CHANGELOG.md"

[project.scripts]
reelay = "reelay.cli:main"

[project.entry-points.pytest11]
reelay = "reelay.pytest_plugin"

[tool.setuptools.dynamic]
version = { attr = "reelay.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reelay = ["py.typed"]
"reelay.dashboard" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "N", "S", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "S603",    # subprocess without shell is the intended, safe pattern for hooks
    "S101",    # asserts are used for internal invariants
    "RUF001",  # unicode box-drawing characters are intentional
    "PLW2901",
    "S311",    # chaos and templates use reproducible pseudo-randomness on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415", "N802", "N815", "PLR0917", "RUF012", "E501"]
"scripts/**" = ["S", "T20"]
"examples/**" = ["S"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/reelay"]

[[tool.mypy.overrides]]
# pytest's internals pull in numpy stubs that use 3.12-only syntax; the plugin only needs pytest's public API.
module = ["_pytest.*", "numpy", "numpy.*"]
follow_imports = "skip"
