<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Reelay · live traffic</title>
<link rel="stylesheet" href="{{PREFIX}}/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='16' r='7' fill='none' stroke='%23a78bfa' stroke-width='3'/%3E%3Ccircle cx='22' cy='16' r='7' fill='none' stroke='%23a78bfa' stroke-width='3' opacity='.55'/%3E%3C/svg%3E">
</head>
<body data-prefix="{{PREFIX}}">
<header class="top">
  <div class="brand">
    <svg class="reels" viewBox="0 0 48 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><circle cx="36" cy="12" r="9"/><circle cx="36" cy="12" r="2.5"/><path d="M12 21h24"/></svg>
    <span class="name">reelay</span><span class="ver">v{{VERSION}}</span>
  </div>
  <nav class="modes" id="modes" aria-label="Server mode"></nav>
  <div class="live"><span class="dot" id="live-dot"></span><span id="live-text">connecting</span></div>
</header>

<main>
  <section class="cards" id="cards" aria-label="Statistics">
    <div class="card"><span class="n" id="s-total">0</span><span class="l">requests</span></div>
    <div class="card"><span class="n c-replayed" id="s-replayed">0</span><span class="l">replayed</span></div>
    <div class="card"><span class="n c-recorded" id="s-recorded">0</span><span class="l">recorded</span></div>
    <div class="card"><span class="n c-proxied" id="s-proxied">0</span><span class="l">proxied</span></div>
    <div class="card"><span class="n c-miss" id="s-miss">0</span><span class="l">misses</span></div>
    <div class="card"><span class="n" id="s-p50">0</span><span class="l">p50 ms</span></div>
    <div class="card"><span class="n" id="s-p95">0</span><span class="l">p95 ms</span></div>
  </section>

  <section class="meta" id="meta"></section>

  <section class="panel">
    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter: path, method, status, source…" autocomplete="off" spellcheck="false">
      <button id="pause" type="button" class="btn" aria-pressed="false">Pause</button>
      <button id="reset" type="button" class="btn" title="Restart sequential replay from the first recording">Reset sequence</button>
      <button id="clear" type="button" class="btn ghost">Clear</button>
    </div>
    <div class="table-wrap">
      <table class="traffic">
        <thead><tr><th>Time</th><th>Method</th><th>Path</th><th>Status</th><th>Source</th><th class="r">Latency</th><th>Notes</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty">
        <div class="empty-reels"><span></span><span></span></div>
        <p>Waiting for traffic.</p>
        <code id="hint"></code>
      </div>
    </div>
  </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><span class="method" id="d-method"></span> <span class="d-path" id="d-path"></span></div>
    <button class="btn ghost" id="d-close" type="button" aria-label="Close details">Close</button>
  </div>
  <div class="d-badges" id="d-badges"></div>
  <div class="tabs" role="tablist">
    <button role="tab" class="tab on" data-tab="response">Response</button>
    <button role="tab" class="tab" data-tab="request">Request</button>
    <button role="tab" class="tab" data-tab="raw">Raw JSON</button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<footer class="foot">Reelay · record real APIs, replay them anywhere · Created by <a href="https://github.com/jullewz" target="_blank" rel="noopener">jullewz</a></footer>
<script src="{{PREFIX}}/app.js"></script>
</body>
</html>
